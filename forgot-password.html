<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowUp - Parolni tiklash</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <h2>🔒 Parolni tiklash</h2>
                <p>Hisobingizga bog'langan elektron pochtani kiriting</p>
            </div>

            <form action="login.html" method="GET">
                <div class="input-group">
                    <label for="recovery-email">Elektron pochta</label>
                    <input type="email" id="recovery-email" placeholder="example@mail.com" required>
                </div>

                <button type="submit" class="btn-submit">Tiklash kodini yuborish</button>
            </form>

            <div class="register-link">
                <a href="login.html">← Orqaga, kirish sahifasiga qaytish</a>
            </div>
        </div>
    </div>

</body>
</html>
