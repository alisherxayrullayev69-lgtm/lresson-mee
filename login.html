<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowUp - Kirish</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <h2>🚀 GrowUp</h2>
                <p>Shaxsiy rivojlanish va vaqt boshqaruvi platformasi</p>
            </div>

            <!-- Login formasi -->
            <form action="index.html" method="GET">
                <div class="input-group">
                    <label for="email">Elektron pochta yoki Foydalanuvchi nomi</label>
                    <input type="text" id="email" placeholder="Sardor Alimov" required>
                </div>

                <div class="input-group">
                    <label for="password">Parol</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox"> Eslab qolish
                    </label>
                    <a href="forgot-password.html" class="forgot-password">Parolni unutdingizmi?</a>
                </div>

                <!-- Tugmani bosganda to'g'ridan-to'g'ri index.html (Bosh sahifa) ga o'tadi -->
                <button type="submit" class="btn-submit">Tizimga kirish</button>
            </form>

            <div class="register-link">
                Hisobingiz yo'qmi? <a href="register.html">Ro'yxatdan o'tish</a>
            </div>
        </div>
    </div>

</body>
</html>
